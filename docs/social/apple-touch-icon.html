<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Caprasimo';
        src: url('caprasimo.woff2') format('woff2');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 180px;
        height: 180px;
        background: #2b1810;
        display: grid;
        place-items: center;
      }
      /* No rounded corners: iOS masks the icon itself. */
      span {
        font-family: 'Caprasimo';
        font-size: 76px;
        color: #f9f4ed;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      span i {
        font-style: normal;
        color: #e08a4f;
      }
    </style>
  </head>
  <body>
    <span>np<i>.</i></span>
  </body>
</html>
