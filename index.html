<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Neha Parmar — Technical Product Management &amp; Frontend Engineering</title>
    <meta
      name="description"
      content="Ten years of frontend engineering across logistics and financial services, now owning the product lifecycle end to end — requirements, UX validation, backlog and release."
    />
    <meta name="author" content="Neha Parmar" />
    <meta name="theme-color" content="#2b1810" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Both faces are needed above the fold, and neither is discoverable
         until the CSS parses, so they are fetched in parallel with it. -->
    <link
      rel="preload"
      href="/fonts/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/caprasimo-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Neha Parmar — Technical Product Management &amp; Frontend Engineering"
    />
    <meta
      property="og:description"
      content="Turning complex data into clarity. Ten years of frontend engineering, now owning the product lifecycle end to end."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Referrer is never needed by anything this site links to. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      This site renders its content without JavaScript, but the case-study panels need it to
      expand.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
